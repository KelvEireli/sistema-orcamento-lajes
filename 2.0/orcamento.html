<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Orçamento</title>

  <link rel="stylesheet" href="style.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script src="app.js" defer></script>
</head>

<body>


  <div class="app-container">
    <div class="screen">

      <!-- HEADER ADMIN -->
<header class="screen-header">
  <a href="cliente.html">
    <i data-lucide="user-plus"></i>
    Novo Cliente
  </a>

  <a href="orcamento.html">
    <i data-lucide="file-plus"></i>
    Novo Orçamento
  </a>

  <a href="consulta.html">
    <i data-lucide="search"></i>
    Consultar
  </a>

  <a href="historico.html">
    <i data-lucide="archive"></i>
    Histórico
  </a>

  <a href="#" onclick="logout()">
    <i data-lucide="log-out"></i>
    Sair
  </a>
</header>

      <!-- CONTEÚDO -->
      <main class="screen-content">

        <h1>
          <i data-lucide="file-text"></i>
          Novo Orçamento
        </h1>

        <div class="card">

          <!-- CLIENTE -->
          <label for="cliente_nome">
            <i data-lucide="user"></i>
            Cliente
          </label>
          <input
            id="cliente_nome"
            placeholder="Digite para buscar o cliente"
            oninput="buscarClientes(this.value)"
          >

          <ul id="listaClientes"></ul>

          <!-- AMBIENTE -->
          <label for="ambiente">
            <i data-lucide="home"></i>
            Ambiente
          </label>
          <input
            id="ambiente"
            placeholder="Ex: Sala, Cozinha, Garagem"
          >

          <!-- TIPO DE LAJE -->
          <label for="tipo">
            <i data-lucide="layers"></i>
            Tipo de laje
          </label>
          <select id="tipo" onchange="mostrarResultado()">
            <option value="150">Laje Treliçada</option>
            <option value="180">Laje Maciça</option>
            <option value="210">Laje Nervurada</option>
          </select>

          <!-- DIMENSÕES -->
            <label>
              Largura (m)
            </label>
            <input
              type="number"
              id="largura"
              placeholder="Ex: 5"
              oninput="calcularArea()"
            />

            <label>
              Comprimento (m)
            </label>
            <input
              type="number"
              id="comprimento"
              placeholder="Ex: 4"
              oninput="calcularArea()"
            />

            <!-- ÁREA AUTOMÁTICA -->
            <label>
              Área (m²)
            </label>
            <input
              type="number"
              id="area"
              readonly
            />


          <!-- PAGAMENTO -->
          <label for="pagamento">
            <i data-lucide="credit-card"></i>
            Forma de pagamento
          </label>
          <select id="pagamento" onchange="mostrarResultado()">
            <option value="1">À vista</option>
            <option value="1.1">Parcelado</option>
          </select>

          <!-- DATA -->
          <label for="data">
            <i data-lucide="calendar"></i>
            Data de entrega
          </label>
          <input type="date" id="data">

          <!-- RESULTADO -->
          <div id="resultado" class="resultado"></div>

          <!-- AÇÃO -->
          <button onclick="salvarOrcamento()">
            <i data-lucide="save"></i>
            Salvar Orçamento
          </button>

        </div>

      </main>
    </div>
  </div>

  <!-- ÍCONES -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
