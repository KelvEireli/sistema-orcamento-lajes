<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Orçamento</title>

  <link rel="stylesheet" href="style.css">

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script src="app.js" defer></script>
</head>

<body>

<div class="app-container">
  <div class="screen">

    <!-- HEADER -->
    <header class="screen-header">
      <a href="cliente.html"><i data-lucide="user-plus"></i> Novo Cliente</a>
      <a href="orcamento.html"><i data-lucide="file-plus"></i> Novo Orçamento</a>
      <a href="consulta.html"><i data-lucide="search"></i> Consultar</a>
      <a href="historico.html"><i data-lucide="archive"></i> Histórico</a>
      <a href="#" onclick="logout()"><i data-lucide="log-out"></i> Sair</a>
    </header>

    <!-- CONTEÚDO -->
    <main class="screen-content">

      <h1><i data-lucide="file-text"></i> Novo Orçamento</h1>

      <div class="card">

        <!-- CLIENTE -->
        <label>Cliente</label>
        <input
          id="cliente_nome"
          placeholder="Digite para buscar o cliente"
          oninput="buscarClientes(this.value)"
        >
        <ul id="listaClientes"></ul>

        <!-- WHATSAPP -->
        <label>WhatsApp</label>
        <input id="whatsapp" placeholder="Ex: 32999999999">

        <!-- AMBIENTE -->
        <label>Ambiente</label>
        <input id="ambiente" placeholder="Ex: Sala, Garagem, Cozinha">

        <!-- ENDEREÇO -->
        <label>Endereço de Entrega</label>
        <input id="endereco_entrega" placeholder="Rua, número, bairro">

        <!-- TIPO DE LAJE -->
        <label>Tipo de Laje</label>
        <select id="tipo" onchange="mostrarResultado()">
          <option>Carregando lajes...</option>
        </select>

        <!-- DIMENSÕES -->
        <label>Largura (m)</label>
        <input type="number" id="largura" oninput="calcularArea()">

        <label>Comprimento (m)</label>
        <input type="number" id="comprimento" oninput="calcularArea()">

        <label>Área (m²)</label>
        <input type="number" id="area" readonly>

        <!-- FRETE -->
        <label>Frete (R$)</label>
        <input type="number" id="frete" value="100" readonly>
        <!-- PAGAMENTO -->
        <label>Forma de Pagamento</label>
        <select id="pagamento" onchange="mostrarResultado()">
          <option value="1">À vista</option>
          <option value="1.1">Parcelado</option>
        </select>

        <!-- PRAZO -->
        <label>Data mínima de entrega</label>
        <input type="date" id="data">

        <!-- RESULTADO -->
        <div id="resultado" class="resultado"></div>

        <!-- BOTÃO -->
        <button onclick="salvarOrcamento()">
          <i data-lucide="save"></i>
          Salvar Orçamento
        </button>

      </div>

    </main>
  </div>
</div>

<!-- ÍCONES -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  document.addEventListener("DOMContentLoaded", () => {
    if (typeof protegerPaginaAdmin === "function") {
      protegerPaginaAdmin();
    }

    if (typeof carregarLajes === "function") {
      carregarLajes();
    }

    if (typeof definirPrazoMinimo === "function") {
      definirPrazoMinimo();
    }
  });
</script>

</body>
</html>
